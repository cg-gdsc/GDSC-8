import requests
import json

# Carica il file JSON
with open("submission.json", "r") as f:
    payload = json.load(f)

# URL dell'API (sostituisci con l'URL reale)
api_url = "https://api.example.com/submit"

# Invia la richiesta POST
response = requests.post(
    api_url,
    json=payload,
    headers={
        "Authorization": f"Bearer {AWS_SESSION_TOKEN}",  # Se richiesto
        "Content-Type": "application/json"
    }
)

# Verifica la risposta
if response.status_code == 200:
    print("✅ Sottomissione avvenuta con successo!")
else:
    print(f"❌ Errore: {response.text}")
